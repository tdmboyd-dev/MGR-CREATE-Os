<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiVAL REAPER — Arena</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#32263c,#09080d 55%,#020203);color:white;font-family:system-ui;min-height:100vh;overflow:hidden}.wrap{padding:3vw}.brand{font-weight:1000;font-size:clamp(40px,8vw,110px);letter-spacing:-.06em}.brand span{color:#f5c542}.sub{letter-spacing:.25em;text-transform:uppercase;color:#aaa;font-weight:900}.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:1vw;margin-top:4vh}.t{min-height:35vh;border-radius:2vw;padding:1.4vw;display:flex;flex-direction:column;justify-content:end;font-size:clamp(14px,2vw,30px);font-weight:1000;text-transform:uppercase;box-shadow:inset 0 -80px 120px #0009}.t b{font-size:clamp(22px,3vw,48px)}.red{background:linear-gradient(#200008,#b30d28)}.blue{background:linear-gradient(#001a35,#0876d9)}.green{background:linear-gradient(#03210e,#38d36b);color:#04140a}.orange{background:linear-gradient(#321100,#ff7a18);color:#211000}.pink{background:linear-gradient(#330020,#ff3ca6)}.bottom{margin-top:3vh;display:flex;justify-content:space-between;align-items:end}.count{font-size:clamp(22px,4vw,60px);font-weight:1000}.pulse{animation:p .7s ease}@keyframes p{50%{transform:scale(1.02);filter:brightness(1.5)}}</style>
<div class="wrap"><div class="sub">Many Sipz of Tea • Rival Day III</div><div class="brand">RiVAL <span>REAPER</span></div><div class="teams" id="teams"></div><div class="bottom"><div><div class="sub">The machine keeps receipts.</div><div class="count" id="count">Waiting for the first victim…</div></div><div class="sub">Blackout Krew stays outside the raffle.</div></div></div>
<script>const defs=[['blood-bloom','Blood Bloom','red'],['pressure-gang','Pressure Gang','blue'],['high-society','High Society','green'],['heat-mob','Heat Mob','orange'],['pink-venom','Pink Venom','pink']];const teams=document.querySelector('#teams'),count=document.querySelector('#count');function render(s,boom=false){teams.innerHTML=defs.map(([id,n,c])=>{const t=s.teams.find(x=>x.id===id);return '<div class="t '+c+(boom?' pulse':'')+'"><b>'+n+'</b><div>'+(t?.assigned??0)+' / '+(t?.capacity??'?')+'</div></div>'}).join('');count.textContent=s.remaining+' names still waiting • '+s.drawCount+' fates locked'}fetch('/api/state').then(r=>r.json()).then(s=>render(s));const es=new EventSource('/api/events');es.addEventListener('state',e=>render(JSON.parse(e.data)));es.addEventListener('draw',e=>render(JSON.parse(e.data),true));</script></html>
