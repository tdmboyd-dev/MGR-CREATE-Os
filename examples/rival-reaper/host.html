<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiVAL REAPER — Host</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07070a;color:#fff;font:16px system-ui}.w{max-width:760px;margin:auto;padding:18px}h1{font-size:42px;margin:.2em 0}.card{background:#121219;border:1px solid #ffffff20;border-radius:18px;padding:16px;margin:12px 0}label{display:block;font-weight:800;margin-bottom:7px}input,button{width:100%;min-height:50px;border-radius:12px;border:1px solid #ffffff22;padding:12px;font-size:16px}input{background:#09090d;color:#fff;margin-bottom:10px}button{background:#f3c63b;color:#161108;font-weight:1000}.muted{color:#aaa;font-size:13px}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.team{background:#0007;padding:10px;border-radius:10px}.receipt{font:12px ui-monospace,monospace;word-break:break-all;color:#b8b8c0}</style>
<div class="w"><div class="muted">PRIVATE HOST CONTROL ROOM</div><h1>RiVAL REAPER</h1><div class="card"><label>Host token</label><input id="token" type="password" autocomplete="off" placeholder="RIVAL_REAPER_HOST_TOKEN"><label>Player ID</label><input id="player" autocomplete="off" placeholder="private roster id"><button id="draw">YANK + LOCK FATE</button><p class="muted">Production rule: once this returns a receipt, there is no silent reroll. The public reveal can be theatrical, but the fate is already locked.</p></div><div class="card"><div class="teams" id="teams"></div></div><div class="card"><b>Last receipt</b><div id="receipt" class="receipt">None yet.</div></div></div>
<script>const q=s=>document.querySelector(s);function render(s){q('#teams').innerHTML=s.teams.map(t=>'<div class="team"><b>'+t.name+'</b><br>'+t.assigned+' / '+t.capacity+'</div>').join('')}async function state(){render(await (await fetch('/api/state')).json())}q('#draw').addEventListener('click',async()=>{const token=q('#token').value,playerId=q('#player').value.trim();if(!token||!playerId)return alert('Token and player ID required');const r=await fetch('/api/host/draw',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify({playerId})});const data=await r.json();if(!r.ok)return alert(data.error||'Draw failed');q('#receipt').textContent=JSON.stringify(data.receipt,null,2);q('#player').value='';state()});state();</script></html>
